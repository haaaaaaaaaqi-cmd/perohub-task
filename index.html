function getTaskComments(taskId) { return tsComments.filter(c => c.taskId === taskId).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)); }
function formatCommentTime(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
  if (diff < 604800) return Math.floor(diff / 86400) + '天前';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function getRelDate(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

// --- Helpers ---
function getTsPriority(key) { return TS_PRIORITIES.find(p => p.key === key) || TS_PRIORITIES[3]; }
function getTsStatus(key) { return TS_STATUSES.find(s => s.key === key) || TS_STATUSES[0]; }
function getTsMember(id) { return TS_MEMBERS.find(m => m.id === id) || { id, name: id, color: '#94a3b8' }; }

// Map a daily-report member name to the task-system member object.
// Current user ('好奇') maps to TS_CURRENT_USER (u0).
// Other members: try exact name match first, then fall back to index order.
function dailyNameToTsMember(name) {
  if (name === getCurrentUser()) return TS_CURRENT_USER;
  const direct = TS_MEMBERS.find(m => m.name === name);
  if (direct) return direct;
  const others = DAILY_MEMBERS.filter(m => m.name !== getCurrentUser());
  const idx = others.findIndex(m => m.name === name);
  const tsOthers = TS_MEMBERS.filter(m => m.id !== TS_CURRENT_USER.id);
  if (idx >= 0 && idx < tsOthers.length) return tsOthers[idx];
  return null;
}

function getTsTag(key) { return TS_TAG_DEFS.find(t => t.key === key) || { key, label: key, color: '#94a3b8' }; }

function isTsOverdue(task) {
  if (!task.dueDate || task.status === 'done') return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(task.dueDate); due.setHours(0, 0, 0, 0);
  return due < today;
}
function isTsDueToday(task) {
  if (!task.dueDate || task.status === 'done') return false;
  return task.dueDate === new Date().toISOString().slice(0, 10);
}
function formatTsDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '明天';
  if (diff === -1) return '昨天';
  if (diff > 0 && diff <= 7) return diff + '天后';
  if (diff < 0 && diff >= -7) return Math.abs(diff) + '天前';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

// --- Filtering ---
function getFilteredTasks() {
  let filtered = [...tsTasks];

  switch (tsFilter) {
    case 'mine':
      filtered = filtered.filter(t => t.assigneeIds.includes(TS_CURRENT_USER.id) && t.status !== 'done');
      break;
    case 'following':
      filtered = filtered.filter(t => t.followerIds.includes(TS_CURRENT_USER.id) && t.status !== 'done');
      break;
    case 'created':
      filtered = filtered.filter(t => t.createdBy === TS_CURRENT_USER.id);
      break;
    case 'done':
      filtered = filtered.filter(t => t.status === 'done');
      break;
    case 'all':
      // all tasks
      break;
    case 'list':
      if (tsFilterListId) {
        filtered = filtered.filter(t => t.listId === tsFilterListId);
      }
      break;
  }

  if (tsSearchQuery) {
    const q = tsSearchQuery.toLowerCase();
    filtered = filtered.filter(t =>
      t.title.toLowerCase().includes(q) ||
      (t.desc || '').toLowerCase().includes(q) ||
      t.assigneeIds.some(id => getTsMember(id).name.includes(q))
    );
  }

  // Sort: overdue first, then by priority, then by due date
  filtered.sort((a, b) => {
    if (a.status === 'done' && b.status !== 'done') return 1;
    if (a.status !== 'done' && b.status === 'done') return -1;
    const priOrder = { high: 0, medium: 1, low: 2, none: 3 };
    if (priOrder[a.priority] !== priOrder[b.priority]) return priOrder[a.priority] - priOrder[b.priority];
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return a.order - b.order;
  });

  return filtered;
}

function getTaskCountForFilter(filter) {
  switch (filter) {
    case 'mine': return tsTasks.filter(t => t.assigneeIds.includes(TS_CURRENT_USER.id) && t.status !== 'done').length;
    case 'following': return tsTasks.filter(t => t.followerIds.includes(TS_CURRENT_USER.id) && t.status !== 'done').length;
    case 'created': return tsTasks.filter(t => t.createdBy === TS_CURRENT_USER.id).length;
    case 'done': return tsTasks.filter(t => t.status === 'done').length;
    case 'all': return tsTasks.length;
    default: return 0;
  }
}

  const itemsHtml = sorted.map((l, i) => `
    <div class="ts-customize-item" draggable="true" data-id="${l.id}" data-order="${i}"
      ondragstart="tsCustomizeDragStart(event, '${l.id}')"
      ondragover="tsCustomizeDragOver(event)"
      ondragleave="tsCustomizeDragLeave(event)"
      ondrop="tsCustomizeDrop(event, '${l.id}')"
      ondragend="tsCustomizeDragEnd(event)">
      <svg class="ts-customize-drag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      <span class="ts-customize-dot" style="background:${l.color};"></span>

    </div>
  `).join('');

  overlay.innerHTML = `<div class="ts-modal" style="max-width:420px;" onclick="event.stopPropagation()">
    <div class="ts-modal-header">
      <span class="ts-modal-title">管理任务清单</span>

    </div>
    <div class="ts-modal-body">
      <div class="ts-customize-section-label">拖拽排序 · 开关显示</div>
      <div class="ts-customize-list" id="tsCustomizeList">
        ${itemsHtml}
      </div>
    </div>
    <div class="ts-modal-footer">
      <button class="btn btn-primary" onclick="closeTsCustomizeModal()">完成</button>

  </div>`;
  document.body.appendChild(overlay);
}

function closeTsCustomizeModal() {
  const el = document.getElementById('tsCustomizeModal');
  if (el) el.remove();
}

function tsCustomizeDragStart(e, id) {
  _tsCustomizeDragId = id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function tsCustomizeDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const item = e.target.closest('.ts-customize-item');
  if (item) {
    item.style.background = 'var(--accent-soft)';
  }
}

function tsCustomizeDragLeave(e) {
  const item = e.target.closest('.ts-customize-item');
  if (item) {
    item.style.background = '';
  }
}

function tsCustomizeDrop(e, targetId) {
  e.preventDefault();
  const item = e.target.closest('.ts-customize-item');
  if (item) item.style.background = '';
  if (!_tsCustomizeDragId || _tsCustomizeDragId === targetId) return;

  // Reorder
  const dragIdx = tsLists.findIndex(l => l.id === _tsCustomizeDragId);
  const targetIdx = tsLists.findIndex(l => l.id === targetId);
  if (dragIdx === -1 || targetIdx === -1) return;

  const [moved] = tsLists.splice(dragIdx, 1);
  tsLists.splice(targetIdx, 0, moved);

  // Update order values
  tsLists.forEach((l, i) => { l.order = i; });
  saveTsLists();

  // Refresh modal and sidebar
  closeTsCustomizeModal();
  openTsCustomizeModal();
  renderTsSidebar();
}

function tsCustomizeDragEnd(e) {
  _tsCustomizeDragId = null;
  e.target.classList.remove('dragging');
}

function tsToggleListHidden(listId) {
  const l = getTsList(listId);
  if (!l) return;
  l.hidden = !l.hidden;
  saveTsLists();
  renderTsSidebar();
  // Refresh modal toggle state
  const modal = document.getElementById('tsCustomizeModal');
  if (modal) {
    const toggle = modal.querySelector(`[onclick="tsToggleListHidden('${listId}')"]`);
    if (toggle) toggle.classList.toggle('on', !l.hidden);
  }
}

function tsToggleListArchive(listId) {
  const l = getTsList(listId);

  showToast(l.archived ? '清单已归档' : '清单已取消归档', 'success');

function tsDuplicateList(listId) {
  const l = getTsList(listId);
  if (!l) return;
  
  const newId = 'tl-' + Date.now();
  const maxOrder = tsLists.length > 0 ? Math.max(...tsLists.map(x => x.order || 0)) : -1;
  const newList = {
    id: newId,
    name: l.name + ' 副本',
    color: l.color,
    groupId: l.groupId,
    order: maxOrder + 1,
    hidden: false,
    archived: false,
    following: true,
    createdAt: new Date().toISOString()
  };
  tsLists.push(newList);
  
  // Duplicate tasks
  const listTasks = tsTasks.filter(t => t.listId === listId);
  const idMap = {};
  listTasks.forEach(t => {
    const newTaskId = 'tt-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
    idMap[t.id] = newTaskId;
    tsTasks.push({
      ...t,
      id: newTaskId,
      listId: newId,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  });
  
  saveTsLists();
  saveTsTasks();
  renderTsSidebar();
  renderDailyContent();
  showToast('清单已复制', 'success');
}

  } else if (totalCount === 0 && tsSearchQuery) {
    html += `<div class="ts-empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <div class="ts-empty-state-text">未找到匹配的任务</div>
    </div>`;
  } else {
    if (tsViewMode === 'board') html += renderTsBoardView(filtered);
    else html += renderTsListView(filtered);
  }

  html += `</div>`;
  return html;
}

function tsSetSubFilter(key) {
  tsSubFilter = key;
  renderDailyContent();
}

function tsSwitchView(mode) {
  tsViewMode = mode;
  renderDailyContent();
}

function tsSearch(val) {
  tsSearchQuery = val;
  renderDailyContent();
  // Restore focus
  setTimeout(() => {
    const inp = document.querySelector('.ts-search-box input');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }, 0);
}

// --- List View ---
function renderTsListView(tasks) {
  let html = '<div class="ts-list-view">';
  html += tasks.map(t => _renderTsTaskRow(t, 0)).join('');
  if (tsInlineNewTask) {
    html += `<div class="ts-task-row ts-inline-new-task" onclick="event.stopPropagation()">
      <div class="ts-task-pri-dot" style="background:#94a3b8;"></div>
      <input type="text" class="ts-inline-task-input" id="tsInlineTaskInput" placeholder="输入任务名称，按回车创建..." 
        onkeydown="tsInlineTaskKeydown(event)" 
        onblur="tsCommitInlineTask()" />
    </div>`;
  }
  html += '</div>';
  return html;
}

function _renderTsTaskRow(task, depth) {
  const pri = getTsPriority(task.priority);
  const dueText = task.dueDate ? formatTsDate(task.dueDate) : '';
  const overdue = isTsOverdue(task);
  const dueToday = isTsDueToday(task);
  const assignees = task.assigneeIds.map(id => getTsMember(id));

  let html = `<div class="ts-task-row ${task.status === 'done' ? 'done' : ''} ${tsOpenTaskId === task.id ? 'active' : ''}" onclick="openTsTaskModal('${task.id}')" style="${depth > 0 ? 'padding-left:' + (12 + depth * 24) + 'px;' : ''}">
    <div class="ts-task-pri-dot" style="background:${pri.dot};" title="优先级: ${pri.label}"></div>
    <span class="ts-task-title">${escapeHtml(task.title)}</span>
    <div class="ts-task-meta">`;

  if (task.tags.length > 0) {
    task.tags.forEach(tagKey => {
      const tag = getTsTag(tagKey);
      html += `<span class="ts-task-tag" style="background:${tag.color}20;color:${tag.color};">${escapeHtml(tag.label)}</span>`;
    });
  }
  if (dueText) {
    html += `<span class="ts-task-tag due ${overdue ? 'overdue' : ''} ${dueToday ? 'today' : ''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      ${dueText}</span>`;
  }
  if (assignees.length > 0) {
    assignees.forEach(a => {
      html += `<div class="ts-avatar" style="background:${a.color};" title="${escapeHtml(a.name)}">${escapeHtml(a.name.charAt(0))}</div>`;
    });
  }

  html += `</div></div>`;

  return html;
}

// --- Board View ---
function renderTsBoardView(tasks) {
  const cols = [
    { key: 'todo', label: '待处理', color: '#94a3b8' },
    { key: 'doing', label: '进行中', color: '#3b82f6' },
    { key: 'done', label: '已完成', color: '#22c55e' },
  ];

  let html = '<div class="ts-board">';
  cols.forEach(col => {
    const colTasks = tasks.filter(t => t.status === col.key);
    html += `<div class="ts-col">
      <div class="ts-col-header">
        <span class="ts-col-dot" style="background:${col.color};"></span>
        <span class="ts-col-name">${col.label}</span>
        <span class="ts-col-count">${colTasks.length}</span>
        <button class="ts-col-add" onclick="openTsTaskModal(null, '${col.key}')" title="新建任务">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="ts-col-body" data-status="${col.key}" ondragover="tsDragOver(event)" ondragleave="tsDragLeave(event)" ondrop="tsDrop(event, '${col.key}')">
        ${colTasks.map(t => _renderTsCard(t)).join('')}
        ${colTasks.length === 0 ? '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:12px;">拖拽任务到此</div>' : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function _renderTsCard(task) {
  const pri = getTsPriority(task.priority);
  const dueText = task.dueDate ? formatTsDate(task.dueDate) : '';
  const overdue = isTsOverdue(task);
  const dueToday = isTsDueToday(task);
  const assignees = task.assigneeIds.map(id => getTsMember(id));

  let html = `<div class="ts-card ts-card-pri-${task.priority} ${task.status === 'done' ? 'done' : ''} ${tsOpenTaskId === task.id ? 'active' : ''}" draggable="true" ondragstart="tsDragStart(event, '${task.id}')" ondragend="tsDragEnd(event)" onclick="openTsTaskModal('${task.id}')">
    <div class="ts-card-title">${escapeHtml(task.title)}</div>`;
  if (task.desc) html += `<div class="ts-card-desc">${escapeHtml(task.desc)}</div>`;
  html += `<div class="ts-card-meta">`;
  if (task.tags.length > 0) {
    task.tags.forEach(tagKey => {
      const tag = getTsTag(tagKey);
      html += `<span class="ts-card-tag" style="background:${tag.color}20;color:${tag.color};">${escapeHtml(tag.label)}</span>`;
    });
  }
  if (dueText) html += `<span class="ts-card-tag due ${overdue ? 'overdue' : ''} ${dueToday ? 'today' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${dueText}</span>`;
  if (assignees.length > 0) {
    assignees.forEach(a => { html += `<div class="ts-avatar" style="background:${a.color};" title="${escapeHtml(a.name)}">${escapeHtml(a.name.charAt(0))}</div>`; });
  }
  html += `</div></div>`;
  return html;
}

// --- Drag & Drop ---
function tsDragStart(e, taskId) {
  tsDragTaskId = taskId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function tsDragEnd(e) {
  e.target.classList.remove('dragging');
  tsDragTaskId = null;
}
function tsDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function tsDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function tsDrop(e, status) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!tsDragTaskId) return;
  const task = tsTasks.find(t => t.id === tsDragTaskId);
  if (task && task.status !== status) {
    task.status = status;
    if (status === 'done') task.completedAt = new Date().toISOString();
    else task.completedAt = null;
    saveTsTasks();
    renderTsSidebar();
    renderDailyContent();
  }
}

// --- Toggle Done ---
function tsToggleDone(taskId) {
  const task = tsTasks.find(t => t.id === taskId);
  if (!task) return;
  if (task.status === 'done') {
    task.status = 'todo';
    task.completedAt = null;
  } else {
    task.status = 'done';
    task.completedAt = new Date().toISOString();
  }
  saveTsTasks();
  renderTsSidebar();
  renderDailyContent();
}

// --- Task Modal ---

  tsEditingPriority = isEdit ? (task.priority || 'none') : 'none';
  tsEditingAssignees = isEdit ? [...task.assigneeIds] : [TS_CURRENT_USER.id];
  tsEditingFollowers = isEdit ? [...task.followerIds] : [];
  tsEditingTags = isEdit ? [...task.tags] : [];

  const listId = isEdit ? task.listId : (tsFilter === 'list' ? tsFilterListId : (tsLists[0]?.id || ''));
  const list = tsLists.find(l => l.id === listId);
  const comments = isEdit ? getTaskComments(taskId) : [];

  // Helper: format date for display
  const formatDueDate = (dateStr) => {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const taskDate = new Date(d);
    taskDate.setHours(0, 0, 0, 0);

    if (taskDate.getTime() === today.getTime()) return '今天';
    if (taskDate.getTime() === tomorrow.getTime()) return '明天';
    return dateStr;
  };

  const dueDate = isEdit ? task.dueDate : '';
  const dueDateLabel = formatDueDate(dueDate);

  // Determine due chip state
  const todayStr = new Date().toISOString().split('T')[0];
  const tmrwDate = new Date();
  tmrwDate.setDate(tmrwDate.getDate() + 1);
  const tomorrowStr = tmrwDate.toISOString().split('T')[0];

// Handle date picked from custom date picker
function tsOnCustomDuePicked(taskId) {
  const dueInput = document.getElementById('tsTaskDue');
  if (!dueInput || !dueInput.value) return;
  const dateStr = dueInput.value;
  
  // Format the date for display
  const d = new Date(dateStr);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const taskDate = new Date(d);
  taskDate.setHours(0, 0, 0, 0);
  let label;
  if (taskDate.getTime() === today.getTime()) label = '今天';
  else if (taskDate.getTime() === tomorrow.getTime()) label = '明天';
  else label = dateStr;

  // Hide the "其他时间" chip, show the custom-date chip
  const chipsContainer = document.getElementById('tsDueChips');
  if (chipsContainer) {
    const customChip = chipsContainer.querySelector('.ts-due-chip.custom');
    const customDateChip = chipsContainer.querySelector('.ts-due-chip.custom-date');
    if (customChip) customChip.style.display = 'none';
    if (customDateChip) {
      customDateChip.style.display = '';
      customDateChip.classList.add('active');
      // Update label text (last text node after svg)
      const textNode = Array.from(customDateChip.childNodes).find(n => n.nodeType === 3);
      if (textNode) textNode.textContent = label;
      else customDateChip.appendChild(document.createTextNode(label));
    }
  }

  // Hide the date picker
  const picker = document.getElementById('tsCustomDuePicker');
  if (picker) picker.classList.remove('show');

  // Auto-save
  if (taskId && taskId !== 'null') {
    tsAutoSaveTask(taskId);
  }
}

// Set due date via chip
function tsSetDueDate(dateStr) {
  const todayStr = new Date().toISOString().split('T')[0];
  const tmrwDate = new Date();
  tmrwDate.setDate(tmrwDate.getDate() + 1);
  const tomorrowStr = tmrwDate.toISOString().split('T')[0];

  const isToday = dateStr === todayStr;
  const isTomorrow = dateStr === tomorrowStr;
  const isCustom = !isToday && !isTomorrow && dateStr;

  // Update chips UI - hide non-selected chips
  const chipsContainer = document.getElementById('tsDueChips');
  if (chipsContainer) {
    chipsContainer.querySelectorAll('.ts-due-chip').forEach(chip => {
      chip.classList.remove('active');
      if (isToday && chip.classList.contains('today')) {
        chip.classList.add('active');
        chip.style.display = '';
      } else if (isTomorrow && chip.classList.contains('tomorrow')) {
        chip.classList.add('active');
        chip.style.display = '';
      } else if (isCustom && chip.classList.contains('custom-date')) {
        chip.classList.add('active');
        chip.style.display = '';
        // Update label text
        const textNode = Array.from(chip.childNodes).find(n => n.nodeType === 3);
        if (textNode) textNode.textContent = dateStr;
      } else {
        chip.style.display = 'none';
      }
    });
    // If no date set, show all chips (except custom-date)
    if (!dateStr) {
      chipsContainer.querySelectorAll('.ts-due-chip:not(.custom-date)').forEach(chip => {
        chip.style.display = '';
      });
    }
  }

  // Update date picker
  const picker = document.getElementById('tsCustomDuePicker');
  const dueInput = document.getElementById('tsTaskDue');
  if (dueInput) dueInput.value = dateStr;
  if (picker) {
    picker.classList.remove('show');
  }

  // Auto-save
  if (tsOpenTaskId && tsOpenTaskId !== 'new') {
    tsAutoSaveTask(tsOpenTaskId);
  }
}

function openTsTaskModal(taskId, defaultStatus) {
  const panelKey = taskId || 'new';

  // If clicking the same task that's already open → close panel
  if (tsOpenTaskId === panelKey) {
    closeTsTaskModal();
    return;
  }

  // Build panel content
  const { html } = _buildTsDetailPanelHtml(taskId, defaultStatus);

  const existingPanel = document.getElementById('tsDetailPanel');

  if (existingPanel) {
    // Panel already open → swap content instantly, no animation
    existingPanel.innerHTML = html;
    tsOpenTaskId = panelKey;
    _initTsDetailForm();
  } else {
    // Panel not open → create with expand animation
    const panel = document.createElement('div');
    panel.className = 'ts-detail-panel';
    panel.id = 'tsDetailPanel';
    panel.innerHTML = html;

    const app = document.querySelector('.app');
    app.appendChild(panel);

    tsOpenTaskId = panelKey;

    // Trigger expand animation
    requestAnimationFrame(() => {
      panel.classList.add('open');
    });

    setTimeout(() => {
      _initTsDetailForm();
    }, 350);
  }
}

function closeTsTaskModal() {
  const panel = document.getElementById('tsDetailPanel');
  if (!panel) return;
  tsOpenTaskId = null;
  panel.classList.remove('open');
  setTimeout(() => {
    if (panel.parentNode) panel.remove();
  }, 300);
}

function tsShowMemberDropdown(type, e) {
  e.stopPropagation();
  _tsCloseMemberDropdown();
  const existing = type === 'assignee' ? tsEditingAssignees : tsEditingFollowers;
  const available = TS_MEMBERS.filter(m => !existing.includes(m.id));
  const dropdown = document.createElement('div');
  dropdown.className = 'ts-member-dropdown';
  dropdown.id = 'tsMemberDropdown';
  dropdown.innerHTML = available.length === 0
    ? '<div class="ts-member-option" style="color:var(--text-tertiary);cursor:default;">无可添加成员</div>'
    : available.map(m => `<div class="ts-member-option" onclick="tsAddMember('${type}', '${m.id}')"><div class="ts-avatar" style="background:${m.color};">${escapeHtml(m.name.charAt(0))}</div>${escapeHtml(m.name)}</div>`).join('');
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  dropdown.style.position = 'fixed';
  dropdown.style.top = (rect.bottom + 4) + 'px';
  dropdown.style.left = rect.left + 'px';
  document.body.appendChild(dropdown);
  setTimeout(() => document.addEventListener('click', _tsCloseMemberDropdown, { once: true }), 0);
}
function _tsCloseMemberDropdown() { const el = document.getElementById('tsMemberDropdown'); if (el) el.remove(); }
function tsAddMember(type, id) {
  if (type === 'assignee') tsEditingAssignees.push(id);
  else tsEditingFollowers.push(id);

function tsRemoveFollower(id) {

function tsToggleTag(key) {

// Save task
function tsSaveTask(taskId, defaultStatus) {
  const title = document.getElementById('tsTaskTitle').value.trim();
  if (!title) { showToast('请输入任务标题', 'warning'); return; }
  const desc = document.getElementById('tsTaskDesc').value.trim();
  const dueDate = document.getElementById('tsTaskDue').value || '';
  const listId = document.getElementById('tsTaskList').value || null;
  const now = new Date().toISOString();

  if (taskId) {
    // Edit existing
    const task = tsTasks.find(t => t.id === taskId);
    if (!task) return;
    task.title = title;
    task.desc = desc;
    task.dueDate = dueDate;
    task.listId = listId;
    task.priority = tsEditingPriority;
    task.assigneeIds = [...tsEditingAssignees];
    task.followerIds = [...tsEditingFollowers];
    task.tags = [...tsEditingTags];

    showToast('任务已更新', 'success');
  } else {
    // Create new
    const newId = 'ts-' + Date.now();
    const status = defaultStatus || 'todo';
    tsTasks.push({
      id: newId, title, desc, status, priority: tsEditingPriority,
      dueDate, startDate: '', assigneeIds: [...tsEditingAssignees],
      followerIds: [...tsEditingFollowers], listId, tags: [...tsEditingTags],
      createdAt: now, createdBy: TS_CURRENT_USER.id,
      order: tsTasks.length, completedAt: status === 'done' ? now : null
    });
    showToast('任务已创建', 'success');
  }

  saveTsTasks();
  closeTsTaskModal();
  renderTsSidebar();
  renderDailyContent();
}

function tsDeleteTask(taskId) {
  const task = tsTasks.find(t => t.id === taskId);
  if (!task) return;
  if (confirm(`确定要删除任务「${task.title}」吗？`)) {
    tsTasks = tsTasks.filter(t => t.id !== taskId);
    saveTsTasks();
    closeTsTaskModal();
    renderTsSidebar();
    renderDailyContent();
    showToast('任务已删除', 'info');
  }
}

            <div class="roster-row" onclick="openUserProfile('${escapeHtml(m.name)}')">
              <div class="roster-cell">
                <div style="width:28px; height:28px; border-radius:50%; background:${dept.color}22; color:${dept.color}; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;">${escapeHtml(m.name.charAt(0))}</div>
              </div>
              <div class="roster-cell" style="font-weight:600; color:var(--text-primary);">${escapeHtml(m.name)}</div>
              <div class="roster-cell" style="font-family:monospace; font-size:12px; color:var(--text-tertiary);">${m.empNo}</div>
              <div class="roster-cell">${escapeHtml(m.title)}</div>
              <div class="roster-cell"><span style="background:var(--bg-elevated); padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600;">${m.level}</span></div>
              <div class="roster-cell" style="color:var(--text-tertiary);">${m.order}</div>
              <div class="roster-cell" style="color:var(--text-tertiary);">${tenureStr}</div>
              <div class="roster-cell" style="color:var(--text-primary); font-weight:500;">${(m.salary / 10000).toFixed(2)}<span style="font-size:11px; color:var(--text-tertiary);">万元</span></div>
              <div class="roster-cell">
                <div style="display:flex; align-items:center; gap:6px;">
                  <div style="width:36px; height:4px; background:var(--bg-elevated); border-radius:2px; overflow:hidden;">
                    <div style="width:${m.performance}%; height:100%; background:${perfColor};"></div>
                  </div>
                  <span style="font-size:11px; color:${perfColor}; font-weight:600;">${m.performance}</span>
                </div>
              </div>
            </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  });

  return html;
}

function renderDailyMine() {
  const viewingAs = dailyViewingUser || getCurrentUser();
  const isSelf = dailyViewingUser === null;
  let myReports = dailyReports.filter(r => r.author === viewingAs);
  const mineBadge = document.getElementById('dailyMineBadge');
  if (mineBadge) mineBadge.textContent = myReports.length;
  const allBadge = document.getElementById('dailyCountBadge');
  if (allBadge) allBadge.textContent = dailyReports.length;

  const reportDateSet = new Set(myReports.map(r => r.date));

  const startDate = new Date();
  startDate.setMonth(7);
  startDate.setDate(1);
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const workdays = [];
  const d = new Date(startDate);
  d.setHours(0, 0, 0, 0);
  while (d <= today) {
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) {
      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      workdays.push(dateStr);
    }
    d.setDate(d.getDate() + 1);
  }

  const missingDates = workdays.filter(dt => !reportDateSet.has(dt));
  const missingCount = missingDates.length;

  const combinedList = [];
  myReports.forEach(r => combinedList.push({ type: 'report', data: r, date: r.date }));
  missingDates.forEach(dt => combinedList.push({ type: 'missing', data: null, date: dt }));
  combinedList.sort((a, b) => new Date(b.date) - new Date(a.date));

  if (dailySearchQuery) {
    const q = dailySearchQuery.toLowerCase();
    const filtered = combinedList.filter(item => {
      if (item.type === 'missing') return false;
      const r = item.data;
      return r.author.toLowerCase().includes(q) ||
        (r.problems || '').toLowerCase().includes(q) ||
        (r.tomorrowPlan || '').toLowerCase().includes(q) ||
        (r.notes || '').toLowerCase().includes(q) ||
        r.tasks.some(t => t.name.toLowerCase().includes(q));
    });
    combinedList.length = 0;
    combinedList.push(...filtered);
  }

  const todayReport = myReports.find(r => r.date === todayStr());
  const draftReports = myReports.filter(r => r.status === 'draft');
  const submittedReports = myReports.filter(r => r.status === 'submitted');
  const supplementReports = myReports.filter(r => r.isSupplement);
  const onTimeReports = myReports.filter(r => r.status === 'submitted' && !r.isSupplement);
  const totalPersonDays = myReports.flatMap(r => r.tasks).reduce((s, t) => s + getTaskPersonDays(t), 0);
  const fillRate = workdays.length > 0 ? Math.round((myReports.length / workdays.length) * 100) : 0;
  const avgScore = myReports.length > 0 ? Math.round(myReports.reduce((s, r) => s + (r.score || 85), 0) / myReports.length) : 0;

  let html = `
    <div class="daily-toolbar">
      <div class="daily-toolbar-left">
        ${!isSelf ? `<button class="daily-back-btn" onclick="closeUserProfile()" title="返回员工名册"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>` : ''}
        <span class="daily-toolbar-title">${isSelf ? '我的' : escapeHtml(viewingAs) + ' 的主页'}</span>
      </div>
      <div class="daily-toolbar-right">
        <div class="home-toggle-group">
          <button class="home-toggle-btn ${dailyHomeTab === 'tasks' ? 'active' : ''}" onclick="setDailyHomeTab('tasks')">任务</button>
          <button class="home-toggle-btn ${dailyHomeTab === 'daily' ? 'active' : ''}" onclick="setDailyHomeTab('daily')">日报</button>
          <button class="home-toggle-btn ${dailyHomeTab === 'highlights' ? 'active' : ''}" onclick="setDailyHomeTab('highlights')">高光</button>
          <button class="home-toggle-btn ${dailyHomeTab === 'message' ? 'active' : ''}" onclick="setDailyHomeTab('message')">寄语</button>
          <button class="home-toggle-btn ${dailyHomeTab === 'profile' ? 'active' : ''}" onclick="setDailyHomeTab('profile')">个人资料</button>
        </div>
      </div>
    </div>
  `;

  // --- Branch content by home sub-tab ---
  if (dailyHomeTab === 'tasks') {
    html += renderWorkbench(viewingAs);
    return html;
  }
  if (dailyHomeTab === 'highlights') {
    html += renderHomeHighlights(myReports, viewingAs, isSelf);
    return html;
  }
  if (dailyHomeTab === 'message') {
    html += renderHomeMessage(myReports, viewingAs, isSelf);
    return html;
  }
  if (dailyHomeTab === 'profile') {
    html += renderHomeProfile(viewingAs, isSelf);
    return html;
  }
  // default: daily tab — existing daily report content

  html += `
    <div class="daily-stats" style="grid-template-columns: repeat(4, 1fr);">
      <div class="daily-stat-card">
        <div class="daily-stat-icon" style="background: rgba(34,211,238,0.12); color: var(--accent);">📊</div>
        <div class="daily-stat-value">${fillRate}<span class="stat-unit">%</span></div>
        <div class="daily-stat-label">日报填写率</div>
      </div>
      <div class="daily-stat-card">
        <div class="daily-stat-icon" style="background: rgba(167,139,250,0.12); color: var(--purple);">✏️</div>
        <div class="daily-stat-value">${supplementReports.length}</div>
        <div class="daily-stat-label">补写日报</div>
      </div>
      <div class="daily-stat-card">
        <div class="daily-stat-icon" style="background: rgba(251,191,36,0.12); color: var(--warning);">⚠️</div>
        <div class="daily-stat-value">${missingCount}</div>
        <div class="daily-stat-label">未写日报</div>
      </div>
      <div class="daily-stat-card">
        <div class="daily-stat-icon" style="background: rgba(52,211,153,0.12); color: var(--success);">⭐</div>
        <div class="daily-stat-value">${avgScore}</div>
        <div class="daily-stat-label">日报评分</div>
      </div>
    </div>
  `;

  if (isSelf) {
    if (todayReport) {
      html += `
        <div style="background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius-md); padding:16px 20px; margin-bottom:24px; display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:40px; height:40px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:20px;">✅</div>
            <div>
              <div style="font-size:14px; font-weight:600; color:var(--accent);">今日日报已填写</div>
              <div style="font-size:12px; color:var(--text-tertiary); margin-top:2px;">${todayReport.tasks.length}个任务 · ${todayReport.status === 'draft' ? '草稿状态，尚未提交' : '已提交'}</div>
            </div>
          </div>
          <button class="btn btn-secondary" onclick="editDailyReport('${todayReport.id}')">继续编辑</button>
        </div>
      `;
    } else {
      html += `
        <div style="background:var(--bg-secondary); border:1px dashed var(--border-light); border-radius:var(--radius-md); padding:16px 20px; margin-bottom:24px; display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:40px; height:40px; border-radius:10px; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; font-size:20px;">📋</div>
            <div>
              <div style="font-size:14px; font-weight:600; color:var(--text-primary);">今日尚未填写日报</div>
              <div style="font-size:12px; color:var(--text-tertiary); margin-top:2px;">点击右侧按钮开始填写今天的工作</div>
            </div>
          </div>
          <button class="btn btn-primary" onclick="openDailyEditor()">写今日日报</button>
        </div>
      `;
    }
  }

  if (combinedList.length === 0) {
    html += `
      <div class="daily-empty">
        <div class="daily-empty-icon">📋</div>
        <div class="daily-empty-text">${dailySearchQuery ? '没有找到匹配的日报' : (isSelf ? '你还没有写过日报' : escapeHtml(viewingAs) + ' 还没有写过日报')}</div>
        ${isSelf && !dailySearchQuery ? '<button class="btn btn-primary" onclick="openDailyEditor()">写第一篇日报</button>' : ''}
      </div>
    `;
    return html;
  }

  // --- Group combinedList by week (Monday-based), sorted desc ---
  const WEEK_PER_PAGE = 4;
  const weekGroups = [];
  let currentWeekKey = null;
  let currentWeekItems = [];
  combinedList.forEach(item => {
    const itemDate = new Date(item.date + 'T00:00:00');
    const monday = new Date(itemDate);
    const dow = itemDate.getDay();
    const diff = dow === 0 ? 6 : dow - 1;
    monday.setDate(itemDate.getDate() - diff);
    const weekKey = `${monday.getFullYear()}-${monday.getMonth()+1}-${monday.getDate()}`;
    if (weekKey !== currentWeekKey) {
      if (currentWeekKey !== null) weekGroups.push({ key: currentWeekKey, items: currentWeekItems });
      currentWeekKey = weekKey;
      currentWeekItems = [];
    }
    currentWeekItems.push(item);
  });
  if (currentWeekKey !== null) weekGroups.push({ key: currentWeekKey, items: currentWeekItems });

  const totalPages = Math.max(1, Math.ceil(weekGroups.length / WEEK_PER_PAGE));
  if (dailyMinePage >= totalPages) dailyMinePage = totalPages - 1;
  if (dailyMinePage < 0) dailyMinePage = 0;
  const startWeek = dailyMinePage * WEEK_PER_PAGE;
  const pageWeekGroups = weekGroups.slice(startWeek, startWeek + WEEK_PER_PAGE);

  html += '<div class="daily-report-list">';
  let prevWeekKey = null;
  pageWeekGroups.forEach(group => {
    // Week divider
    const [y, m, d] = group.key.split('-').map(Number);
    const monday = new Date(y, m - 1, d);
    const monDt = formatDate(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    const sun = new Date(monday);
    sun.setDate(sun.getDate() + 6);
    const sunDt = formatDate(`${sun.getFullYear()}-${String(sun.getMonth()+1).padStart(2,'0')}-${String(sun.getDate()).padStart(2,'0')}`);
    if (prevWeekKey !== null) {
      html += `<div class="daily-report-week-divider"><span class="daily-report-week-divider-label">${monDt.month}${monDt.day}日 - ${sunDt.month}${sunDt.day}日</span></div>`;
    }
    prevWeekKey = group.key;

    group.items.forEach(item => {
      if (item.type === 'missing') {
        const dt = formatDate(item.date);
        const editable = isSelf && isEditable(item.date);
        const clickable = editable;
        html += `
          <div class="daily-report-card is-missing${editable ? '' : ' is-expired'}"${clickable ? ` onclick="openDailyEditorForDate('${item.date}')"` : ''}>
            <div class="daily-report-date-block">
              <div class="daily-report-date-day">${dt.day}</div>
              <div class="daily-report-date-month">${dt.month}</div>
              <div class="daily-report-date-weekday">${dt.weekday}</div>
            </div>
            <div class="daily-report-missing-body">
              <div class="daily-report-missing-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                未填写日报
              </div>
              <div class="daily-report-missing-desc">${editable ? '该工作日未提交日报，点击补充填写' : (isSelf ? '已超过补写期限（超过3天）' : '该工作日未提交日报')}</div>
            </div>
            ${editable ? `<div class="daily-report-actions" onclick="event.stopPropagation()">
              <button onclick="openDailyEditorForDate('${item.date}')" title="补写日报">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                补写
              </button>
            </div>` : ''}
          </div>
        `;
      } else {
        html += renderDailyReportCards([item.data], null);
      }
    });
  });
  html += '</div>';

  // --- Pagination controls ---
  if (totalPages > 1) {
    const firstWeek = pageWeekGroups[0];
    const lastWeek = pageWeekGroups[pageWeekGroups.length - 1];
    const [fy, fm, fd] = firstWeek.key.split('-').map(Number);
    const fMon = new Date(fy, fm - 1, fd);
    const fSun = new Date(fMon); fSun.setDate(fSun.getDate() + 6);
    const [ly, lm, ld] = lastWeek.key.split('-').map(Number);
    const lMon = new Date(ly, lm - 1, ld);
    const lSun = new Date(lMon); lSun.setDate(lSun.getDate() + 6);
    const fmt = (dt) => `${dt.getMonth()+1}月${dt.getDate()}日`;
    html += `
      <div class="daily-pagination">
        <button class="daily-page-btn" ${dailyMinePage === 0 ? 'disabled' : ''} onclick="setDailyMinePage(${dailyMinePage - 1})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          上一页
        </button>
        <span class="daily-page-info">第 ${dailyMinePage + 1} / ${totalPages} 页 · ${fmt(fMon)} - ${fmt(lSun)}</span>
        <button class="daily-page-btn" ${dailyMinePage >= totalPages - 1 ? 'disabled' : ''} onclick="setDailyMinePage(${dailyMinePage + 1})">
          下一页
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    `;
  }

  return html;
}

// --- 高光事迹：弹窗操作 ---
let highlightRecipient = '';

function openHighlightEditor(recipient, id) {
  highlightRecipient = recipient;
  highlightEditingId = id || null;
  const titleEl = document.getElementById('highlightEditorTitle');
  const dateEl = document.getElementById('highlightDateInput');
  const titleInput = document.getElementById('highlightTitleInput');
  const contentInput = document.getElementById('highlightContentInput');

  if (highlightEditingId) {
    const h = dailyHighlights.find(x => x.id === highlightEditingId);
    if (h) {
      titleEl.textContent = '编辑高光事迹';
      dateEl.value = h.date;
      titleInput.value = h.title;
      contentInput.value = h.content;
    }
  } else {
    titleEl.textContent = '添加高光事迹';
    dateEl.value = todayStr();
    titleInput.value = '';
    contentInput.value = '';
  }
  document.getElementById('highlightEditorOverlay').classList.remove('hidden');
}

function closeHighlightEditor() {
  document.getElementById('highlightEditorOverlay').classList.add('hidden');
  highlightEditingId = null;
}

function saveHighlight() {
  const date = document.getElementById('highlightDateInput').value;
  const title = document.getElementById('highlightTitleInput').value.trim();
  const content = document.getElementById('highlightContentInput').value.trim();

  if (!date) { showToast('请选择发生日期', 'error'); return; }
  if (!title) { showToast('请填写事迹标题', 'error'); return; }
  if (!content) { showToast('请填写详细描述', 'error'); return; }

  if (highlightEditingId) {
    // 仅更新允许编辑的字段，保留 recipient / createdBy / createdAt
    const idx = dailyHighlights.findIndex(h => h.id === highlightEditingId);
    if (idx >= 0) {
      dailyHighlights[idx] = {
        ...dailyHighlights[idx],
        title,
        content,
        date,
        updatedAt: Date.now()
      };
    }
    showToast('高光事迹已更新', 'success');
  } else {
    const record = {
      id: 'hl-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      recipient: highlightRecipient,
      title,
      content,
      date,
      createdBy: getCurrentUser(),
      createdAt: Date.now(),
      likes: []
    };
    dailyHighlights.push(record);
    showToast('高光事迹已添加', 'success');
  }

  saveDailyHighlights();
  closeHighlightEditor();
  renderDailyContent();
}

function deleteHighlight(id) {
  if (!confirm('确认删除该高光事迹？')) return;
  dailyHighlights = dailyHighlights.filter(h => h.id !== id);
  saveDailyHighlights();
  showToast('高光事迹已删除', 'success');
  renderDailyContent();
}

// --- 高光事迹：点赞 ---
function toggleHighlightLike(id) {
  const h = dailyHighlights.find(x => x.id === id);
  if (!h) return;
  if (!h.likes) h.likes = [];
  const me = getCurrentUser();
  const idx = h.likes.indexOf(me);
  if (idx >= 0) {
    h.likes.splice(idx, 1);
    showToast('已取消点赞', 'info');
  } else {
    h.likes.push(me);
    showToast('点赞成功', 'success');
  }
  saveDailyHighlights();
  renderDailyContent();
}

// --- 寄语：弹窗操作 ---
let messageRecipient = '';

function openMessageEditor(recipient, id) {
  messageRecipient = recipient;
  messageEditingId = id || null;
  const titleEl = document.getElementById('messageEditorTitle');
  const dateEl = document.getElementById('messageDateInput');
  const titleInput = document.getElementById('messageTitleInput');
  const contentInput = document.getElementById('messageContentInput');

  if (messageEditingId) {
    const m = dailyMessages.find(x => x.id === messageEditingId);
    if (m) {
      titleEl.textContent = '编辑寄语';
      dateEl.value = m.date;
      titleInput.value = m.title;
      contentInput.value = m.content;
    }
  } else {
    titleEl.textContent = '添加寄语';
    dateEl.value = todayStr();
    titleInput.value = '';
    contentInput.value = '';
  }
  document.getElementById('messageEditorOverlay').classList.remove('hidden');
}

function closeMessageEditor() {
  document.getElementById('messageEditorOverlay').classList.add('hidden');
  messageEditingId = null;
}

function saveMessage() {
  const date = document.getElementById('messageDateInput').value;
  const title = document.getElementById('messageTitleInput').value.trim();
  const content = document.getElementById('messageContentInput').value.trim();

  if (!date) { showToast('请选择日期', 'error'); return; }
  if (!title) { showToast('请填写寄语标题', 'error'); return; }
  if (!content) { showToast('请填写寄语内容', 'error'); return; }

  if (messageEditingId) {
    const idx = dailyMessages.findIndex(m => m.id === messageEditingId);
    if (idx >= 0) {
      dailyMessages[idx] = {
        ...dailyMessages[idx],
        title,
        content,
        date,
        updatedAt: Date.now()
      };
    }
    showToast('寄语已更新', 'success');
  } else {
    const record = {
      id: 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      recipient: messageRecipient,
      title,
      content,
      date,
      createdBy: getCurrentUser(),
      createdAt: Date.now(),
      plusOnes: 0
    };
    dailyMessages.push(record);
    showToast('寄语已添加', 'success');
  }

  saveDailyMessages();
  closeMessageEditor();
  renderDailyContent();
}

function deleteMessage(id) {
  if (!confirm('确认删除该寄语？')) return;
  dailyMessages = dailyMessages.filter(m => m.id !== id);
  saveDailyMessages();
  showToast('寄语已删除', 'success');
  renderDailyContent();
}

function plusOneMessage(id) {
  const m = dailyMessages.find(x => x.id === id);
  if (!m) return;
  m.plusOnes = (m.plusOnes || 0) + 1;
  saveDailyMessages();
  showToast('+1 已送出', 'success');
  renderDailyContent();
}

// Render a hexagonal radar chart SVG for the 6 rating dimensions
function renderRatingRadar(rateeName) {
  const cx = 130, cy = 130, maxR = 100;
  const dims = RATING_DIMENSIONS;
  const n = dims.length;
  // angles: start at top (π/2), go clockwise
  const angle = (i) => Math.PI / 2 - i * (2 * Math.PI / n);
  const point = (r, i) => [cx + r * Math.cos(angle(i)), cy - r * Math.sin(angle(i))];

  // Grid hexagons (levels 2,4,6,8,10)
  let gridPolygons = '';
  for (let level = 1; level <= 5; level++) {
    const r = (level / 5) * maxR;
    const pts = dims.map((_, i) => point(r, i).map(p => p.toFixed(1)).join(',')).join(' ');
    gridPolygons += `<polygon points="${pts}" fill="none" stroke="var(--border-color)" stroke-width="1" opacity="${level === 5 ? 0.6 : 0.35}"/>`;
  }

  // Axis lines
  let axes = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = point(maxR, i);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border-color)" stroke-width="1" opacity="0.35"/>`;
  }

  // Data polygon
  const scores = dims.map(d => getDimScore(rateeName, d.key));
  const dataPts = scores.map((s, i) => point((s / 10) * maxR, i).map(p => p.toFixed(1)).join(',')).join(' ');
  const dataPolygon = `<polygon points="${dataPts}" fill="rgba(34,211,238,0.22)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  // Data points
  let dataDots = '';
  scores.forEach((s, i) => {
    if (s > 0) {
      const [x, y] = point((s / 10) * maxR, i);
      dataDots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--bg-secondary)" stroke-width="1.5"/>`;
    }
  });

  // Labels
  let labels = '';
  for (let i = 0; i < n; i++) {
    const [lx, ly] = point(maxR + 18, i);
    const score = scores[i];
    const anchor = Math.abs(lx - cx) < 5 ? 'middle' : (lx > cx ? 'start' : 'end');
    labels += `
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="12" fill="var(--text-secondary)">${dims[i].label}</text>
      <text x="${lx.toFixed(1)}" y="${(ly + 14).toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11" font-weight="700" fill="var(--accent)">${score.toFixed(1)}</text>
    `;
  }

  return `
    <svg class="rating-radar" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      ${gridPolygons}
      ${axes}
      ${dataPolygon}
      ${dataDots}
      ${labels}
    </svg>
  `;
}

function renderDailyCalendar() {
  const year = dailyCalendarDate.getFullYear();
  const month = dailyCalendarDate.getMonth();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthLastDay = new Date(year, month, 0).getDate();
  const today = todayStr();

  const reportDates = new Set(dailyReports.map(r => r.date));

  let cells = [];
  for (let i = 0; i < startWeekday; i++) {
    const day = prevMonthLastDay - startWeekday + i + 1;
    cells.push({ day, otherMonth: true, date: `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}` });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day: d, otherMonth: false, date: dateStr, isToday: dateStr === today, hasReport: reportDates.has(dateStr) });
  }
  const remaining = (7 - (cells.length % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    cells.push({ day: i, otherMonth: true, date: `${year}-${String(month + 2).padStart(2,'0')}-${String(i).padStart(2,'0')}` });
  }

  const weekdays = ['日','一','二','三','四','五','六'];

  let html = `
    <div class="daily-toolbar">
      <div class="daily-toolbar-left">
        <span class="daily-toolbar-title">日历视图</span>
      </div>
    </div>
    <div class="daily-calendar">
      <div class="daily-calendar-header">
        <div class="daily-calendar-title">${year}年 ${monthNames[month]}</div>
        <div class="daily-calendar-nav">
          <button onclick="changeDailyCalendar(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            上月
          </button>
          <button onclick="changeDailyCalendar(0)">今天</button>
          <button onclick="changeDailyCalendar(1)">
            下月
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="daily-calendar-grid">
        ${weekdays.map(w => `<div class="daily-calendar-weekday">${w}</div>`).join('')}
        ${cells.map(c => {
          let cls = 'daily-calendar-cell';
          if (c.otherMonth) cls += ' other-month';
          if (c.isToday) cls += ' today';
          if (c.hasReport) cls += ' has-report';
          const report = dailyReports.find(r => r.date === c.date);
          const onclick = report ? `openDailyDetail('${report.id}')` : `openDailyEditorForDate('${c.date}')`;
          return `<div class="${cls}" onclick="${onclick}">
            <span>${c.day}</span>
            ${c.hasReport ? '<div class="daily-calendar-dot"></div>' : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  return html;
}

function changeDailyCalendar(delta) {
  if (delta === 0) {
    dailyCalendarDate = new Date();
  } else {
    dailyCalendarDate.setMonth(dailyCalendarDate.getMonth() + delta);
  }
  renderDailyContent();
}

function renderDailyStats() {

  const allTasks = dailyReports.flatMap(r => r.tasks);
  const totalPersonDays = allTasks.reduce((s, t) => s + getTaskPersonDays(t), 0);
  const avgProgress = allTasks.length > 0
    ? Math.round(allTasks.reduce((s, t) => s + (parseInt(t.progress) || 0), 0) / allTasks.length)
    : 0;

  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0, 0, 0, 0);
  const thisWeek = dailyReports.filter(r => new Date(r.date) >= weekStart).length;

  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisMonth = dailyReports.filter(r => new Date(r.date) >= monthStart).length;

  const last7Days = [];
  for (let i = 6; i >= 0; i--) {

    last7Days.push({ date: dateStr, count, label: `${d.getMonth()+1}/${d.getDate()}` });

  let html = `

        <span class="daily-toolbar-title">统计分析</span>

        <div class="daily-stat-label">日报总数</div>
      </div>
      <div class="daily-stat-card">

        <div class="daily-stat-value">${submitted}</div>
        <div class="daily-stat-label">已提交</div>
      </div>
      <div class="daily-stat-card">
        <div class="daily-stat-icon" style="background: rgba(167,139,250,0.12); color: var(--purple);">⏱️</div>
        <div class="daily-stat-value">${totalPersonDays.toFixed(1)}</div>
        <div class="daily-stat-label">总人天</div>
      </div>
      <div class="daily-stat-card">
        <div class="daily-stat-icon" style="background: rgba(251,191,36,0.12); color: var(--warning);">📈</div>
        <div class="daily-stat-value">${avgProgress}%</div>
        <div class="daily-stat-label">平均完成度</div>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
      <div class="daily-stat-card">
        <div class="daily-stat-label" style="margin-bottom:12px;">本周日报</div>
        <div class="daily-stat-value">${thisWeek}</div>
        <div style="margin-top:16px;">
          ${last7Days.map(d => `
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
              <span style="font-size:11px; color:var(--text-tertiary); width:40px;">${d.label}</span>
              <div style="flex:1; height:18px; background:var(--bg-elevated); border-radius:4px; overflow:hidden;">
                <div style="height:100%; width:${(d.count / maxCount) * 100}%; background:var(--accent); border-radius:4px; transition:width 0.3s ease;"></div>
              </div>
              <span style="font-size:11px; color:var(--text-tertiary); width:16px; text-align:right;">${d.count}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="daily-stat-card">
        <div class="daily-stat-label" style="margin-bottom:12px;">本月日报</div>
        <div class="daily-stat-value">${thisMonth}</div>
        <div style="margin-top:16px;">
          <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:8px;">任务完成度分布</div>
          ${[100, 75, 50, 25, 0].map(p => {
            const count = allTasks.filter(t => {
              const tp = parseInt(t.progress) || 0;
              if (p === 100) return tp === 100;
              if (p === 0) return tp < 25;
              return tp >= p && tp < p + 25;
            }).length;
            const pct = allTasks.length > 0 ? Math.round(count / allTasks.length * 100) : 0;
            const color = p === 100 ? 'var(--success)' : p >= 75 ? 'var(--accent)' : p >= 50 ? 'var(--warning)' : 'var(--danger)';
            return `
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                <span style="font-size:11px; color:var(--text-tertiary); width:50px;">${p === 0 ? '<25%' : p === 100 ? '100%' : p + '%-' + (p+24) + '%'}</span>

                  <div style="height:100%; width:${pct}%; background:${color}; border-radius:4px;"></div>
                </div>
                <span style="font-size:11px; color:var(--text-tertiary); width:24px; text-align:right;">${count}</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  return html;
}

function editDailyReport(id) {
  const report = dailyReports.find(r => r.id === id);
  if (!report) return;
  dailyEditingId = id;
  document.getElementById('dailyDateInput').value = report.date;
  document.getElementById('dailyProblemsInput').value = report.problems || '';
  document.getElementById('dailyPlanInput').value = report.tomorrowPlan || '';
  document.getElementById('dailyNotesInput').value = report.notes || '';
  document.getElementById('dailyEditorTitle').textContent = '编辑日报';
  // Convert old format (hours or name-only) to new format (taskId + personDays)
  loadTsTasks();
  const convertedTasks = (report.tasks || []).map(t => {
    let taskId = t.taskId || '';
    let taskName = t.name || t.taskName || '';
    if (!taskId && taskName) {
      const found = tsTasks.find(ts => ts.title === taskName);
      if (found) taskId = found.id;
    }
    // Convert hours to personDays if needed (1 person-day = 8 hours as fallback, or keep old value)
    let personDays = t.personDays;
    if (personDays === undefined || personDays === null || personDays === '') {
      personDays = t.hours ? (parseFloat(t.hours) / 8).toFixed(1) : '';
    }
    return {
      taskId,
      taskName,
      name: taskName,
      personDays: personDays
    };
  });
  _dailyEditorTasks = convertedTasks;
  renderDailyTaskRows(convertedTasks);
  updateDailyAllocationBar();
  document.getElementById('dailyEditorOverlay').classList.remove('hidden');
}

function closeDailyEditor() {
  document.getElementById('dailyEditorOverlay').classList.add('hidden');
  dailyEditingId = null;
}

function renderDailyTaskRows(tasks) {
  const container = document.getElementById('dailyTaskRows');
  if (!container) return;
  if (tasks.length === 0) tasks = [{ taskId: '', taskName: '', personDays: '' }];
  // Load task system tasks for selection
  loadTsTasks();
  const taskOptions = tsTasks.map(t => `
    <option value="${t.id}" data-name="${escapeHtml(t.title)}">${escapeHtml(t.title)}</option>
  `).join('');

  container.innerHTML = tasks.map((t, i) => `
    <div class="daily-task-row">
      <select class="daily-task-select" data-task-index="${i}" onchange="updateDailyTaskFromSelect(${i}, this.value)">
        <option value="">— 选择任务 —</option>
        ${taskOptions}
      </select>
      <div class="daily-task-hours-wrap">
        <input type="number" placeholder="0" min="0" step="0.1" max="1" value="${t.personDays || ''}" data-task-index="${i}" data-task-field="personDays" oninput="updateDailyTaskRow(${i}, 'personDays', this.value)" style="width:70px;" />
        <span class="daily-task-hours-label">人天</span>

      <button class="daily-task-remove" onclick="removeDailyTaskRow(${i})" title="删除">

      </button>
    </div>
  `).join('');

  // Restore selected values
  tasks.forEach((t, i) => {
    if (t.taskId) {
      const select = container.querySelector(`select[data-task-index="${i}"]`);
      if (select) select.value = t.taskId;
    }
  });
}

let _dailyEditorTasks = [];

const DAILY_MAX_PERSON_DAYS = 1;

function updateDailyTaskFromSelect(index, taskId) {
  if (!_dailyEditorTasks[index]) _dailyEditorTasks[index] = { taskId: '', taskName: '', personDays: '' };
  const task = tsTasks.find(t => t.id === taskId);
  _dailyEditorTasks[index].taskId = taskId;
  _dailyEditorTasks[index].taskName = task ? task.title : '';
  updateDailyAllocationBar();
}

function updateDailyTaskRow(index, field, value) {
  if (!_dailyEditorTasks[index]) _dailyEditorTasks[index] = { taskId: '', taskName: '', personDays: '' };
  _dailyEditorTasks[index][field] = value;
  updateDailyAllocationBar();
}

function addDailyTaskRow() {
  collectDailyTasksFromDOM();
  _dailyEditorTasks.push({ taskId: '', taskName: '', personDays: '' });
  renderDailyTaskRows(_dailyEditorTasks);
  updateDailyAllocationBar();
}

function removeDailyTaskRow(index) {
  collectDailyTasksFromDOM();
  _dailyEditorTasks.splice(index, 1);
  if (_dailyEditorTasks.length === 0) _dailyEditorTasks.push({ taskId: '', taskName: '', personDays: '' });
  renderDailyTaskRows(_dailyEditorTasks);
  updateDailyAllocationBar();
}

function collectDailyTasksFromDOM() {
  const rows = document.querySelectorAll('.daily-task-row');
  _dailyEditorTasks = [];
  rows.forEach(row => {
    const select = row.querySelector('select.daily-task-select');
    const pdInput = row.querySelector('input[type="number"]');
    const taskId = select ? select.value : '';
    const taskName = select && select.selectedOptions[0] ? select.selectedOptions[0].textContent : '';
    if (taskId && taskName !== '— 选择任务 —') {
      _dailyEditorTasks.push({
        taskId,
        name: taskName,
        personDays: pdInput ? parseFloat(pdInput.value) || 0 : 0
      });
    }
  });
}

function updateDailyAllocationBar() {
  const allocatedEl = document.getElementById('dailyAllocatedValue');
  const remainingEl = document.getElementById('dailyRemainingValue');
  const fillEl = document.getElementById('dailyAllocationFill');
  const addBtn = document.querySelector('.daily-task-add-btn');
  if (!allocatedEl || !remainingEl || !fillEl) return;

  let total = 0;
  _dailyEditorTasks.forEach(t => {
    if (t.taskId || (t.name && t.name.trim())) {
      total += parseFloat(t.personDays) || 0;
    }
  });

  const remaining = DAILY_MAX_PERSON_DAYS - total;
  const pct = Math.min((total / DAILY_MAX_PERSON_DAYS) * 100, 100);
  const isOver = total > DAILY_MAX_PERSON_DAYS + 0.001;

  allocatedEl.textContent = total.toFixed(1) + ' 人天';
  remainingEl.textContent = (isOver ? '超支 ' : '剩余 ') + Math.abs(remaining).toFixed(1) + ' 人天';
  remainingEl.classList.toggle('over', isOver);
  fillEl.style.width = pct + '%';
  fillEl.classList.toggle('over', isOver);

  // Disable add button when fully allocated
  if (addBtn) {
    addBtn.disabled = remaining <= 0 && _dailyEditorTasks.length > 0;
  }
}

function saveDailyReport(status) {
  collectDailyTasksFromDOM();
  const tasks = _dailyEditorTasks.filter(t => t.name && t.name.trim());
  const date = document.getElementById('dailyDateInput').value;
  const author = getCurrentUser();
  const department = getMyDept();

  if (!date) { showToast('请选择日期', 'warning'); return; }
  if (tasks.length === 0) { showToast('请至少选择一项任务', 'warning'); return; }

  // Validate personDays - each task must have personDays > 0 when submitting
  if (status === 'submitted') {
    const noPdTasks = tasks.filter(t => !t.personDays || parseFloat(t.personDays) <= 0);
    if (noPdTasks.length > 0) {
      showToast(`请填写「${noPdTasks[0].name}」的人天`, 'warning');
      return;
    }
    // Validate total person days <= 1
    const total = tasks.reduce((sum, t) => sum + (parseFloat(t.personDays) || 0), 0);
    if (total > DAILY_MAX_PERSON_DAYS + 0.001) {
      showToast(`人天总和不能超过 ${DAILY_MAX_PERSON_DAYS} 人天，当前 ${total.toFixed(1)} 人天`, 'warning');
      return;
    }
  }

  // Ensure tasks have taskId and name properly set
  const savedTasks = tasks.map(t => ({
    taskId: t.taskId || '',
    name: t.name,
    personDays: parseFloat(t.personDays) || 0
  }));

  if (dailyEditingId) {
    const report = dailyReports.find(r => r.id === dailyEditingId);
    if (report) {
      report.date = date;
      report.tasks = savedTasks;
      report.problems = document.getElementById('dailyProblemsInput').value;
      report.tomorrowPlan = document.getElementById('dailyPlanInput').value;
      report.notes = document.getElementById('dailyNotesInput').value;
      report.status = status;
      report.updatedAt = new Date().toISOString();
    }
  } else {
    const existing = dailyReports.find(r => r.date === date && r.author === author);
    if (existing) {
      existing.tasks = savedTasks;
      existing.problems = document.getElementById('dailyProblemsInput').value;
      existing.tomorrowPlan = document.getElementById('dailyPlanInput').value;
      existing.notes = document.getElementById('dailyNotesInput').value;
      existing.status = status;
      existing.updatedAt = new Date().toISOString();
    } else {
      dailyReports.push({
        id: genDailyId(),
        date,
        author,
        department,
        tasks: savedTasks,
        problems: document.getElementById('dailyProblemsInput').value,
        tomorrowPlan: document.getElementById('dailyPlanInput').value,
        notes: document.getElementById('dailyNotesInput').value,
        status,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
    }
  }

  saveDailyReports();
  closeDailyEditor();
  renderDailyContent();
  showToast(status === 'draft' ? '草稿已保存' : '日报已提交', 'success');
}

function deleteDailyReport(id) {
  const report = dailyReports.find(r => r.id === id);
  if (!report) return;
  if (confirmBeforeDeleteFlag() && !confirm(`确认删除 ${report.author} ${report.date} 的日报？`)) return;
  dailyReports = dailyReports.filter(r => r.id !== id);
  saveDailyReports();
  if (dailyDetailId === id) dailyDetailId = null;
  renderDailyContent();
  showToast('日报已删除');
}

function confirmBeforeDeleteFlag() {
  return true;
}

function openDailyDetail(id) {
  dailyDetailId = id;
  renderDailyContent();
}
